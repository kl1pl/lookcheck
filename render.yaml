services:
  - type: web
    name: lookcheck-bot
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m bot.main"
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: PROVIDER_MODE
        value: demo
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///data/bot.db
      - key: DAILY_LIMIT_FREE
        value: "8"
      - key: SEARCH_CACHE_TTL
        value: "600"
      - key: WEBAPP_URL
        value: https://lookcheck-webapp.onrender.com/

  # Статический хостинг мини-аппа (Telegram WebApp)
  - type: web
    name: lookcheck-webapp
    runtime: static
    plan: free
    buildCommand: ""
    staticPublishPath: ./webapp
    envVars: []