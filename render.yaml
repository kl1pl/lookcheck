services:
  - type: web
    name: lookcheck-bot
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m bot.main"
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: PROVIDER_MODE
        value: demo
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///data/bot.db
      - key: DAILY_LIMIT_FREE
        value: "8"
      - key: SEARCH_CACHE_TTL
        value: "600"