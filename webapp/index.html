<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>LookCheck — мини-апп</title>
<style>
  :root{
    --paper:#f5f4ef; --ink:#1c1f26; --green:#0ea472; --dim:#767b70; --line:#dcd9cc; --white:#fff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Segoe UI",system-ui,sans-serif;background:var(--paper);color:var(--ink);
    line-height:1.45;max-width:520px;margin:0 auto;padding:0 0 30px;
    -webkit-font-smoothing:antialiased;
  }
  /* шапка как чек */
  .top{
    background:var(--ink);color:var(--paper);padding:14px 16px;display:flex;align-items:center;gap:10px;
    position:sticky;top:0;z-index:20;
  }
  .top .lg{width:30px;height:30px;background:var(--green);border:2px solid var(--paper);display:grid;place-items:center;font-weight:900;font-size:15px}
  .top .t{font-weight:900;text-transform:uppercase;letter-spacing:.5px;font-size:15px}
  .top .u{margin-left:auto;font-size:12px;color:#b9b4a4}

  /* табы */
  .tabs{display:flex;border-bottom:3px solid var(--ink);background:var(--paper)}
  .tabs button{
    flex:1;padding:13px 6px;border:none;background:transparent;cursor:pointer;
    font-family:"Arial Black",sans-serif;font-weight:900;font-size:12.5px;text-transform:uppercase;
    letter-spacing:.3px;color:var(--dim);border-bottom:3px solid transparent;margin-bottom:-3px;
  }
  .tabs button.active{color:var(--ink);border-bottom-color:var(--green)}

  .page{display:none;padding:16px}
  .page.active{display:block}

  /* поиск */
  .searchbar{display:flex;gap:8px;margin-bottom:14px}
  .searchbar input{
    flex:1;padding:12px 14px;border:3px solid var(--ink);background:var(--white);
    font-size:15px;font-family:inherit;outline:none;
  }
  .searchbar button{
    background:var(--green);border:3px solid var(--ink);color:#fff;font-family:"Arial Black",sans-serif;
    font-weight:900;text-transform:uppercase;padding:0 18px;cursor:pointer;font-size:13px;
  }
  .hint{font-family:Consolas,monospace;font-size:11.5px;color:var(--dim);text-transform:uppercase;margin-bottom:12px}
  .chiprow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .chip{
    border:2px solid var(--ink);background:var(--white);padding:8px 13px;cursor:pointer;
    font-weight:800;font-size:13px;text-transform:uppercase;transition:all .12s;
  }
  .chip:active{background:var(--ink);color:var(--paper)}

  /* карточка товара = чек */
  .prod{background:var(--white);border:3px solid var(--ink);margin-bottom:12px;box-shadow:4px 4px 0 rgba(22,22,22,.85)}
  .prod .h{padding:10px 12px;border-bottom:2px dashed var(--ink);font-weight:900;font-size:14px;text-transform:uppercase}
  .prod .row{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:1px dotted var(--line);font-size:13.5px}
  .prod .row:last-of-type{border-bottom:none}
  .prod .row .pl{color:#555}
  .prod .row .val{font-weight:800;white-space:nowrap}
  .prod .row .best{color:var(--green)}
  .prod .row .old{text-decoration:line-through;color:#a39c8c;margin-left:6px;font-weight:400}
  .prod .warn{background:rgba(14,164,114,.12);border-top:2px solid var(--green);padding:8px 12px;font-size:12.5px;color:#0b6b4a}
  .empty{text-align:center;color:var(--dim);font-family:Consolas,monospace;font-size:13px;padding:30px 0;text-transform:uppercase}

  /* избранное */
  .fav{border:3px solid var(--ink);background:var(--white);margin-bottom:10px;padding:12px}
  .fav .n{font-weight:900;font-size:14px;text-transform:uppercase}
  .fav .p{font-family:Consolas,monospace;color:var(--green);font-weight:700;font-size:15px;margin-top:4px}
  .fav .d{font-size:12px;color:var(--dim);margin-top:3px}

  /* профиль / экономия */
  .saving{background:var(--ink);color:var(--paper);padding:20px;border-radius:0;margin-bottom:14px}
  .saving .k{font-family:Consolas,monospace;font-size:11px;text-transform:uppercase;color:#b9b4a4}
  .saving .v{font-family:"Arial Black",sans-serif;font-size:34px;font-weight:900;color:var(--green);margin:4px 0}
  .saving .row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-top:1px dashed #3a3f52;color:#cfcbbd}

  .note{font-family:Consolas,monospace;font-size:10.5px;color:var(--dim);text-transform:uppercase;text-align:center;margin-top:14px;letter-spacing:.4px}
</style>
</head>
<body>

  <div class="top">
    <div class="lg">%</div>
    <div class="t">LookCheck</div>
    <div class="u" id="userLabel">—</div>
  </div>

  <div class="tabs">
    <button class="active" data-tab="search">Поиск</button>
    <button data-tab="fav">Избранное</button>
    <button data-tab="profile">Экономия</button>
  </div>

  <!-- ПОИСК -->
  <div class="page active" id="page-search">
    <div class="searchbar">
      <input id="q" type="text" placeholder="Напишите товар…" autocomplete="off" aria-label="Название товара для поиска">
      <button id="go">Искать</button>
    </div>
    <div class="chiprow">
      <span class="chip">наушники</span>
      <span class="chip">кроссовки</span>
      <span class="chip">смартфон</span>
      <span class="chip">кофеварка</span>
    </div>
    <div id="results"><div class="empty">Найдите товар —<br>сравним цены на 6 площадках</div></div>
  </div>

  <!-- ИЗБРАННОЕ -->
  <div class="page" id="page-fav">
    <div id="favList"><div class="empty">В избранном пока пусто</div></div>
  </div>

  <!-- ЭКОНОМИЯ -->
  <div class="page" id="page-profile">
    <div class="saving">
      <div class="k">Сэкономлено с ботом</div>
      <div class="v" id="savingTotal">12 400 ₽</div>
      <div class="row"><span>Скидки</span><span id="sDiscount">9 300 ₽</span></div>
      <div class="row"><span>Кэшбэк</span><span id="sCashback">2 860 ₽</span></div>
      <div class="row"><span>Аномалии цен</span><span id="sAnomaly">240 ₽</span></div>
    </div>
    <div class="note">демо-данные · реальная статистика придет от бота</div>
  </div>

<script>
  var tg = null;
  try { if (window.Telegram && Telegram.WebApp) { tg = Telegram.WebApp; tg.ready(); tg.expand(); } } catch(e){}

  var DB = {
    'наушники':[
      {name:'WB · TWS Pro', price:'3 900 ₽', old:'5 900 ₽', best:true, warn:'«скидка 35%» — фейк, по истории максимум 3 900 ₽'},
      {name:'Ozon · TWS Pro', price:'4 500 ₽', best:false},
      {name:'Мегамаркет · +бонусы', price:'3 600 ₽', old:'4 800 ₽', best:false}
    ],
    'кроссовки':[
      {name:'WB · Run 45', price:'3 166 ₽', old:'4 200 ₽', best:true, warn:'70% пишут «маломерит» — берите на размер больше'},
      {name:'Lamoda · Run 45', price:'3 800 ₽', best:false},
      {name:'AliExpress · аналог', price:'2 100 ₽', best:false, warn:'Trust 30/100 — риск'}
    ],
    'смартфон':[
      {name:'Я.Маркет · X 128GB', price:'19 999 ₽', old:'26 999 ₽', best:true},
      {name:'WB · X 128GB', price:'21 000 ₽', best:false},
      {name:'Ozon · X 128GB', price:'22 800 ₽', best:false, warn:'Trust 92/100 — надёжно'}
    ],
    'кофеварка':[
      {name:'WB · капельная 1.2л', price:'1 800 ₽', old:'2 400 ₽', best:true},
      {name:'Ozon · капельная 1.5л', price:'2 100 ₽', best:false}
    ]
  };

  var user = {};
  try {
    var init = tg ? tg.initDataUnsafe : {};
    user = init.user || {};
    document.getElementById('userLabel').textContent = user.first_name || 'гость';
  } catch(e){}

  function fmtPrice(n){ return n.toLocaleString('ru-RU').replace(/\u00a0/g,' ') + ' ₽'; }

  // Поиск
  function doSearch(q){
    var r = document.getElementById('results');
    q = (q || '').trim().toLowerCase();
    if (!q){ r.innerHTML = '<div class="empty">Введите товар</div>'; return; }
    var items = null;
    Object.keys(DB).forEach(function(k){ if(k.indexOf(q) > -1 || q.indexOf(k) > -1) items = DB[k]; });
    if (!items){ r.innerHTML = '<div class="empty">По «'+q+'» ничего не нашли</div>'; return; }
    var html = '';
    items.forEach(function(it, i){
      html += '<div class="prod"><div class="h">' + (i===0?'🥇 ':'🥈 ') + (it.best?'Выгодно':'Альтернатива') + '</div>';
      html += '<div class="row"><span class="pl">'+it.name+'</span><span class="val'+(it.best?' best':'')+'">'+it.price+ (it.old?'<span class="old">'+it.old+'</span>':'') +'</span></div>';
      if (it.warn) html += '<div class="warn">⚠️ '+it.warn+'</div>';
      html += '</div>';
    });
    r.innerHTML = html;
  }

  document.getElementById('go').addEventListener('click', function(){ doSearch(document.getElementById('q').value); });
  document.getElementById('q').addEventListener('keydown', function(e){ if(e.key==='Enter') doSearch(this.value); });
  document.querySelectorAll('.chip').forEach(function(c){
    c.addEventListener('click', function(){ document.getElementById('q').value = this.textContent; doSearch(this.textContent); });
  });

  // Табы
  document.querySelectorAll('.tabs button').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('.tabs button').forEach(function(x){x.classList.remove('active');});
      document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
      b.classList.add('active');
      document.getElementById('page-' + b.dataset.tab).classList.add('active');
    });
  });

  // Избранное (демо)
  var favs = [
    {n:'Наушники TWS Pro (WB)', p:'3 900 ₽', d:'след. проверка: сегодня, 18:00'},
    {n:'Кроссовки Run 45 (WB)', p:'3 166 ₽', d:'упала на 230 ₽ — новая цена'}
  ];
  var fl = document.getElementById('favList');
  if (favs.length){
    fl.innerHTML = favs.map(function(f){
      return '<div class="fav"><div class="n">'+f.n+'</div><div class="p">'+f.p+'</div><div class="d">'+f.d+'</div></div>';
    }).join('');
  }
</script>
</body>
</html>
